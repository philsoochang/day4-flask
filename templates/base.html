<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "on-tertiary-fixed-variant": "#4a463d",
          "secondary-fixed-dim": "#d8c3ad",
          "surface-container-highest": "#e4e2de",
          "surface-container-high": "#eae8e4",
          "surface-bright": "#fbf9f5",
          "tertiary-container": "#beb8ac",
          "surface-container-low": "#f5f3ef",
          "outline-variant": "#d0c4bb",
          "inverse-primary": "#d6c3b3",
          "on-background": "#1b1c1a",
          "surface-dim": "#dbdad6",
          "surface": "#fbf9f5",
          "on-secondary-fixed-variant": "#534434",
          "on-primary-fixed-variant": "#514438",
          "tertiary": "#625e54",
          "surface-container-lowest": "#ffffff",
          "surface-tint": "#6a5c4f",
          "secondary": "#6c5c4a",
          "surface-variant": "#e4e2de",
          "on-error": "#ffffff",
          "tertiary-fixed-dim": "#ccc6b9",
          "inverse-on-surface": "#f2f0ed",
          "on-primary-container": "#54473b",
          "primary-fixed": "#f3dfce",
          "on-tertiary-container": "#4d493f",
          "on-primary-fixed": "#231a0f",
          "on-primary": "#ffffff",
          "background": "#fbf9f5",
          "on-secondary-container": "#726250",
          "outline": "#7f756d",
          "on-secondary-fixed": "#25190c",
          "on-surface": "#1b1c1a",
          "on-surface-variant": "#4d453e",
          "surface-container": "#efeeea",
          "error-container": "#ffdad6",
          "secondary-container": "#f5dfc8",
          "on-error-container": "#93000a",
          "tertiary-fixed": "#e9e2d5",
          "primary-container": "#c8b6a6",
          "inverse-surface": "#30312e",
          "primary-fixed-dim": "#d6c3b3",
          "on-tertiary-fixed": "#1e1b14",
          "primary": "#6a5c4f",
          "on-secondary": "#ffffff",
          "on-tertiary": "#ffffff",
          "error": "#ba1a1a",
          "secondary-fixed": "#f5dfc8"
        },
        borderRadius: {
          DEFAULT: "0.125rem",
          lg: "0.25rem",
          xl: "0.5rem",
          full: "0.75rem"
        },
        spacing: {
          unit: "8px",
          "stack-sm": "16px",
          "margin-mobile": "20px",
          "container-max": "1120px",
          gutter: "24px",
          "stack-md": "32px",
          "content-max": "720px",
          "stack-lg": "64px"
        },
        fontFamily: {
          "headline-xl": ["Newsreader"],
          "body-lg": ["Work Sans"],
          "label-sm": ["Work Sans"],
          "headline-lg": ["Newsreader"],
          "headline-md": ["Newsreader"],
          "body-md": ["Work Sans"]
        },
        fontSize: {
          "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "label-sm": ["13px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
          "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}],
          "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "500"}],
          "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
  body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-background text-on-surface">

<!-- TopAppBar -->
<header class="bg-stone-50 border-b border-stone-200 sticky top-0 z-50">
  <div class="flex justify-between items-center w-full px-6 py-4 max-w-screen-md mx-auto">
    <a href="{{ url_for('post_list') }}" class="font-serif italic tracking-tight text-stone-900 text-xl no-underline">
      The Journal
    </a>
  </div>
</header>

{% block content %}{% endblock %}

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-stone-50/90 backdrop-blur-md border-t border-stone-200">
  <div class="flex justify-around items-center px-4 py-3 max-w-screen-md mx-auto">
    <a class="flex flex-col items-center justify-center transition-all duration-300
      {% if request.endpoint == 'post_list' %}
        text-stone-900 bg-stone-200/50 rounded-lg px-4 py-1
      {% else %}
        text-stone-400 hover:text-stone-600
      {% endif %}"
      href="{{ url_for('post_list') }}">
      <span class="material-symbols-outlined">auto_stories</span>
      <span class="font-sans text-[11px] uppercase tracking-widest mt-1">Library</span>
    </a>
    <a class="flex flex-col items-center justify-center transition-all duration-300
      {% if request.endpoint == 'write_post' %}
        text-stone-900 bg-stone-200/50 rounded-lg px-4 py-1
      {% else %}
        text-stone-400 hover:text-stone-600
      {% endif %}"
      href="{{ url_for('write_post') }}">
      <span class="material-symbols-outlined">add_circle</span>
      <span class="font-sans text-[11px] uppercase tracking-widest mt-1">Create</span>
    </a>
  </div>
</nav>

<div class="h-20"></div>
</body>
</html>
