<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom underline for input focus as per style guidance */
        .focus-underline:focus {
            outline: none;
            border-bottom-color: #6a5c4f;
        }
        .article-progress-bar {
            height: 2px;
            width: 0%;
            background-color: #6a5c4f;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#4a463d",
                    "secondary-fixed-dim": "#d8c3ad",
                    "surface-container-highest": "#e4e2de",
                    "surface-container-high": "#eae8e4",
                    "surface-bright": "#fbf9f5",
                    "tertiary-container": "#beb8ac",
                    "surface-container-low": "#f5f3ef",
                    "outline-variant": "#d0c4bb",
                    "inverse-primary": "#d6c3b3",
                    "on-background": "#1b1c1a",
                    "surface-dim": "#dbdad6",
                    "surface": "#fbf9f5",
                    "on-secondary-fixed-variant": "#534434",
                    "on-primary-fixed-variant": "#514438",
                    "tertiary": "#625e54",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#6a5c4f",
                    "secondary": "#6c5c4a",
                    "surface-variant": "#e4e2de",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#ccc6b9",
                    "inverse-on-surface": "#f2f0ed",
                    "on-primary-container": "#54473b",
                    "primary-fixed": "#f3dfce",
                    "on-tertiary-container": "#4d493f",
                    "on-primary-fixed": "#231a0f",
                    "on-primary": "#ffffff",
                    "background": "#fbf9f5",
                    "on-secondary-container": "#726250",
                    "outline": "#7f756d",
                    "on-secondary-fixed": "#25190c",
                    "on-surface": "#1b1c1a",
                    "on-surface-variant": "#4d453e",
                    "surface-container": "#efeeea",
                    "error-container": "#ffdad6",
                    "secondary-container": "#f5dfc8",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#e9e2d5",
                    "primary-container": "#c8b6a6",
                    "inverse-surface": "#30312e",
                    "primary-fixed-dim": "#d6c3b3",
                    "on-tertiary-fixed": "#1e1b14",
                    "primary": "#6a5c4f",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#f5dfc8"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "8px",
                    "stack-sm": "16px",
                    "margin-mobile": "20px",
                    "container-max": "1120px",
                    "gutter": "24px",
                    "stack-md": "32px",
                    "content-max": "720px",
                    "stack-lg": "64px"
            },
            "fontFamily": {
                    "headline-xl": ["Newsreader"],
                    "body-lg": ["Work Sans"],
                    "label-sm": ["Work Sans"],
                    "headline-lg": ["Newsreader"],
                    "headline-md": ["Newsreader"],
                    "body-md": ["Work Sans"]
            },
            "fontSize": {
                    "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-sm": ["13px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<div class="article-progress-bar" style="width: 15%;"></div>
<!-- TopAppBar -->
<header class="bg-stone-50 dark:bg-stone-900 border-b border-stone-200 dark:border-stone-800 fixed top-0 left-0 right-0 z-50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-screen-md mx-auto">
<div class="flex items-center gap-4">
<button class="text-stone-800 dark:text-stone-100 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors p-2 rounded-lg scale-95 active:opacity-80 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-serif italic tracking-tight text-stone-900 dark:text-stone-50 text-xl">The Journal</h1>
</div>
<div class="flex items-center gap-4">
<button class="bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-6 py-2 rounded transition-all hover:opacity-90 active:scale-95">
                    Save Draft
                </button>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-outline-variant">
<img alt="User profile" class="w-full h-full object-cover" data-alt="Close up portrait of a professional woman with a calm expression in soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDx71QToF0aq4GhDjbrBsccsc9NLIIuaCJxB0I7p3qKoogTbkEqAcYbjQMo0vqLSXmKvV7vljcWbd20D-aJY5vMAPeOrNpw6vQ_yjZ3SVitrcOZ43Z1ERi2s2ujY9phpYUASwnynKij0WtXDnv9UiZGdbUMVRQ1OLEchkqFHZt2EryfGYewxAXFGLZiEuiTYe4sb6NfXOlofFzns5_Mt0TMKTfttM_hmRBHGt3Vo8R7q7NGsuXJ1RHu397RSXsnACXrFACqNS5nbCe2"/>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-stack-lg mt-12 pb-32">
<div class="max-w-[720px] mx-auto px-margin-mobile md:px-0">
<!-- Metadata Area -->
<div class="flex items-center gap-4 mb-stack-md">
<span class="font-label-sm text-label-sm text-on-surface-variant bg-tertiary-fixed px-3 py-1 rounded-full">DRAFT</span>
<span class="font-label-sm text-label-sm text-outline">Last edited 2 mins ago</span>
</div>
<!-- Title Input -->
<div class="mb-stack-md group">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-headline-xl text-headline-xl text-on-surface placeholder:text-surface-dim transition-colors" placeholder="Title of your story..." type="text"/>
</div>
<!-- Image/Media Placeholder (Quiet Luxury Aesthetic) -->
<div class="w-full aspect-[21/9] bg-surface-container-low border border-outline-variant flex flex-col items-center justify-center mb-stack-lg group hover:bg-surface-container transition-colors cursor-pointer rounded-lg overflow-hidden relative">
<img alt="Cover suggestion" class="absolute inset-0 w-full h-full object-cover opacity-20 group-hover:opacity-30 transition-opacity" data-alt="Minimalist workspace with an open notebook, a ceramic mug, and soft morning light hitting a textured wall" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVXwPV0zsMC9uUSZ3I_ic6pRWL0JqhtGnunknlgGK3N01TNXZkRHzDi-cmGbLlmMU7lIt9qgKH3T5srwuY-sxecocirNwVQoifMKMeMks43OS-yFNPU3sJbV6XCY-Q0yt7ppzs3dGALcq8VAsu_CxhrI-syYLlmL7CAohOxwiwuvQ-3c3SK_wwE0dF6Ia0C5o3dg63SD_iHjyebGujEl0vrpzJbL200MM2juVIQXeq1Q7HwqtBb0Vh884LbAnd5xEHG29bRxquzoQz"/>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-outline text-3xl mb-2" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-sm text-label-sm text-outline">Add a cover image</span>
</div>
</div>
<!-- Editor Body -->
<div class="relative">
<textarea class="w-full min-h-[530px] bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface-variant leading-relaxed resize-none placeholder:text-surface-dim" placeholder="Begin your narrative here..."></textarea>
<!-- Floating Toolbar (Appears on selection or focus) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 shadow-sm px-4 py-2 rounded-full flex items-center gap-2 z-40 backdrop-blur-md">
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="format_bold">format_bold</span></button>
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="format_italic">format_italic</span></button>
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="link">link</span></button>
<div class="w-px h-6 bg-stone-200 mx-1"></div>
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="format_quote">format_quote</span></button>
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span></button>
<button class="p-2 text-stone-500 hover:text-stone-900 transition-colors"><span class="material-symbols-outlined" data-icon="image">image</span></button>
</div>
</div>
</div>
</main>
<!-- Post Action Floating Container (Mobile & Small Desktop) -->
<div class="fixed bottom-8 right-8 z-50">
<button class="flex items-center gap-2 bg-primary text-on-primary font-label-sm text-label-sm px-8 py-4 rounded-full shadow-lg hover:shadow-xl transition-all active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
            PUBLISH STORY
        </button>
</div>
<!-- BottomNavBar -->
<nav class="bg-stone-50/90 dark:bg-stone-900/90 backdrop-blur-md border-t border-stone-200 dark:border-stone-800 fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe">
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-stone-600 dark:hover:text-stone-300 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
<span class="font-sans text-[11px] uppercase tracking-widest mt-1">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-900 dark:text-stone-50 bg-stone-200/50 dark:bg-stone-800/50 rounded-lg px-4 py-1 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-sans text-[11px] uppercase tracking-widest mt-1">Create</span>
</a>
<a class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-stone-600 dark:hover:text-stone-300 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-sans text-[11px] uppercase tracking-widest mt-1">Settings</span>
</a>
</nav>
</body></html>
